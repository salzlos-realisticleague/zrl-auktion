<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZRL Auktion">
<link rel="apple-touch-icon" href="zrl-icon.png">
<link rel="icon" type="image/png" href="zrl-icon.png">
<title>ZRL Fahrer-Auktion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--night:#0B0A1F;--panel:#151335;--line:#2C2866;--line2:#39347A;--text:#F2F0FF;--body:#B9B6E0;--muted:#8582B5;--cyan:#3FD0FF;--blue:#2F6BFF;--violet:#7A3CFF;--magenta:#E23CFF;--pink:#F59BFF;--good:#4BE3A8;--bad:#FF6F9C;
--grad:linear-gradient(90deg,#2F6BFF 0%,#7A3CFF 50%,#E23CFF 100%);--gradText:linear-gradient(90deg,#3FD0FF 0%,#8A5CFF 50%,#E23CFF 100%);
--cond:'Barlow Condensed','Arial Narrow','Roboto Condensed','DejaVu Sans Condensed',Arial,sans-serif;--sans:'Barlow','Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--text)}
html.mode-overlay,body.mode-overlay{background:transparent!important;overflow:hidden}

/* ================= OVERLAY ================= */
.ov-root{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.ov-root.preview{position:relative;inset:auto;width:100%;height:0}
.ov-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transition:opacity .5s;font-family:var(--sans);color:var(--text)}
.ov-stage.hidden{opacity:0}
.ov-auction{position:absolute;inset:0;transition:opacity .5s}
.ov-off{opacity:0!important}
.ov-glow{filter:drop-shadow(0 0 22px rgba(122,60,255,.45))}
.ov-cut{clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
.ov-box{position:relative;background:linear-gradient(180deg,rgba(28,24,70,.95),rgba(11,10,31,.95))}
.ov-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#3FD0FF,#7A3CFF,#E23CFF)}

.ov-brand{position:absolute;left:48px;top:36px;transition:opacity .4s}
.ov-brand .ov-box{display:flex;align-items:center;gap:18px;height:76px;padding:0 30px}
.ov-logo{font:800 italic 56px/1.1 var(--cond);background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
.ov-sep{width:2px;height:38px;background:var(--line2)}
.ov-sub{font:700 italic 32px/1 var(--cond);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.ov-lotno{font:700 20px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(63,208,255,.5);border-radius:6px;padding:8px 12px;margin-left:4px;white-space:nowrap}
.ov-lotno:empty{display:none}

.ov-statswrap{position:absolute;right:48px;top:36px;transition:opacity .4s}
.ov-stats{display:flex;align-items:center;height:76px;padding:0 12px 0 18px}
.ov-stat{display:flex;flex-direction:column;justify-content:center;padding:0 24px;border-left:1px solid var(--line2);height:50px}
.ov-stat:first-child{border-left:0}
.ov-stat .k{font:600 14px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;white-space:nowrap}
.ov-stat .v{font:800 italic 36px/1 var(--cond);white-space:nowrap}
.ov-stat .v small{font-size:22px;color:var(--body);font-weight:700;margin-left:4px}

.ov-poolwrap{position:absolute;left:48px;top:140px;width:452px;transition:opacity .4s,transform .4s}
.ov-poolwrap.ov-off{transform:translateX(-30px)}
.ov-pool{padding:22px 26px 24px 32px}
.ov-pool h4{font:800 italic 30px/1 var(--cond);text-transform:uppercase}
.ov-tierhead{display:flex;justify-content:space-between;align-items:baseline;font:600 14px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.ov-tierhead b{font:800 italic 22px/1 var(--cond);letter-spacing:1px;background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px}
.ov-chip{font:600 18px/1 var(--sans);padding:8px 10px;border-radius:6px;border:1px solid var(--line2);background:rgba(21,19,53,.85);white-space:nowrap}
.ov-chip em{font-style:normal;font-weight:700;margin-left:6px;color:var(--cyan)}
.ov-chip.cur{background:var(--grad);border-color:transparent;box-shadow:0 0 16px rgba(226,60,255,.7)}
.ov-chip.sold{opacity:.55}
.ov-chip.later{border-style:dashed;color:var(--body)}
.ov-chip.later em{color:var(--muted)}

.ov-bg{position:absolute;inset:0;background:#0B0A1F center/cover no-repeat;opacity:0;transition:opacity .8s}
.ov-bg::after{content:'';position:absolute;inset:0;background:#0B0A1F;opacity:var(--dim,0)}
.ov-bg.on{opacity:1}
.ov-root.has-bg .ov-reveal{background:radial-gradient(circle at 85% 0%,rgba(58,23,132,.74),rgba(11,10,31,.82) 58%)}
.ov-profwrap{position:absolute;right:48px;top:140px;width:540px;transition:opacity .45s,transform .45s}
.ov-profwrap.ov-off{transform:translateX(34px)}
.ov-prof{padding:24px 30px 26px 36px;max-height:540px;overflow:hidden}
.ov-prof h4{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.pf-t{font:800 italic 30px/1 var(--cond);text-transform:uppercase;flex:none}
.pf-n{font:600 15px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pf-rows{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:22px;row-gap:12px;margin-top:18px}
.pf-k{font:600 14px/1 var(--sans);letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:6px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.pf-v{font:600 23px/1.25 var(--sans);color:var(--text);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pf-ex{margin-top:20px;padding-top:18px;border-top:1px solid var(--line2)}
.pf-ex.solo{margin-top:16px;padding-top:0;border-top:0}
.pf-exh{display:flex;align-items:center;gap:9px;font:700 14px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--body)}
.pf-ex.rule .pf-exh{color:var(--pink)}
.pf-exh svg{width:15px;height:15px;fill:currentColor;flex:none}
.pf-logos{display:flex;gap:18px;margin-top:14px}
.pf-team{display:flex;flex-direction:column;align-items:center;gap:9px;width:116px}
.pf-team>span{font:600 15px/1.15 var(--sans);color:var(--body);text-align:center;letter-spacing:.5px}
.pf-logo{position:relative;width:100px;height:100px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#221E52,#0E0C26);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
.pf-ex.rule .pf-logo{border-color:rgba(226,60,255,.7);box-shadow:0 0 18px rgba(226,60,255,.35)}
.pf-logo img{max-width:76%;max-height:76%;object-fit:contain}
.pf-logo b{font:800 italic 36px/1 var(--cond);letter-spacing:1px;padding-right:3px}
.pf-logo.img{background:none;border:0;box-shadow:none;width:112px;height:112px}
.pf-logo.img img{max-width:100%;max-height:100%}
.pf-ex.rule .pf-logo.img{box-shadow:none}
.pf-ex.rule .pf-logo.img img{filter:drop-shadow(0 0 9px rgba(226,60,255,.75))}
.pf-logo.img i{right:-4px;top:-4px}
.pf-logo i{position:absolute;right:-10px;top:-10px;width:34px;height:34px;border-radius:50%;background:var(--magenta);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(226,60,255,.8)}
.pf-logo i svg{width:17px;height:17px;fill:#fff}
.ov-profwrap.in .ov-prof{animation:pfIn .6s cubic-bezier(.2,1,.3,1)}
@keyframes pfIn{0%{opacity:0;transform:translateX(24px)}100%{opacity:1;transform:none}}

.ov-lowerwrap{position:absolute;left:48px;right:48px;bottom:40px;height:252px;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
.ov-lowerwrap.ov-off{transform:translateY(330px)}
.ov-lower{position:absolute;inset:0;display:grid;grid-template-columns:232px minmax(0,1fr) 660px;background:linear-gradient(180deg,rgba(28,24,70,.96),rgba(11,10,31,.96))}
.ov-topline{position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);z-index:2}
.ov-tier{background:var(--grad);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ov-tier-l{font:800 italic 176px/.86 var(--cond);color:#fff;text-shadow:0 0 34px rgba(255,255,255,.35);padding-right:10px}
.ov-tier-k{font:700 17px/1 var(--sans);letter-spacing:7px;text-transform:uppercase;color:rgba(255,255,255,.88);margin-top:12px;padding-left:7px}
.ov-driver{padding:26px 36px 26px 40px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ov-eyebrow{font:600 19px/1 var(--sans);letter-spacing:4px;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
.ov-name{font:800 italic 104px/1.1 var(--cond);text-transform:uppercase;white-space:nowrap;overflow:hidden;margin:8px 0 10px;padding-right:14px}
.ov-starsrow{display:flex;align-items:baseline;gap:22px;min-height:34px}
.ov-stars{display:flex;align-items:baseline;gap:10px}
.ov-stars em{font:600 16px/1 var(--sans);font-style:normal;letter-spacing:3px;text-transform:uppercase;color:var(--cyan)}
.ov-stars b{font:800 italic 38px/1 var(--cond);background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.ov-stars i{font:700 italic 22px/1 var(--cond);color:var(--body)}
.st-wrap{position:relative;width:28px;height:28px;flex:none}
.st-wrap svg{width:28px;height:28px;display:block}
.st-half{position:absolute;left:0;top:0;width:14px;height:28px;overflow:hidden}
.ov-meta{font:500 23px/1 var(--sans);color:var(--body);white-space:nowrap}
.ov-bid{position:relative;border-left:1px solid var(--line2);display:flex;align-items:center;gap:26px;padding:0 40px}
.ov-bidtext{flex:1;min-width:0}
.ov-pill{display:inline-block;font:700 17px/1 var(--sans);letter-spacing:4px;text-transform:uppercase;padding:9px 14px;border-radius:6px;background:rgba(63,208,255,.12);color:var(--cyan);border:1px solid rgba(63,208,255,.45);white-space:nowrap}
.ov-pill.hot{background:rgba(226,60,255,.16);color:var(--pink);border-color:rgba(226,60,255,.65)}
.ov-pill.dim{background:rgba(133,130,181,.12);color:var(--body);border-color:var(--line2)}
.ov-amount{font:800 italic 124px/1 var(--cond);margin-top:12px;white-space:nowrap;transform-origin:left center}
.ov-amount span{font-size:50px;margin-left:12px;color:var(--body)}
.ov-amount.small{font-size:62px;margin-top:18px;line-height:1.05}
.ov-amount.small span{font-size:36px}
.ov-amount.pop{animation:ovPop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes ovPop{0%{transform:scale(1.25);text-shadow:0 0 40px #E23CFF}100%{transform:scale(1);text-shadow:0 0 0 transparent}}
.ov-bidsub{font:600 18px/1.2 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px;white-space:nowrap;min-height:22px}
.ov-bidsub svg{width:18px;height:18px;fill:var(--magenta);flex:none}
.ov-ring{position:relative;width:170px;height:170px;flex:none;transition:opacity .3s}
.ov-ring>svg{width:170px;height:170px;transform:rotate(-90deg);display:block}
.ov-ring circle{fill:none;stroke-width:12}
.ov-ring .trk{stroke:var(--line)}
.ov-ring .prg{stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ov-ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ov-ringtxt b{font:800 italic 64px/1 var(--cond);display:flex;align-items:center;justify-content:center;padding-right:4px}
.ov-ringtxt b.mm{font-size:50px}
.ov-ringtxt b svg{width:48px;height:48px;fill:var(--magenta)}
.ov-ringtxt span{font:600 13px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ov-ring.urgent b{color:var(--pink);animation:ovBlink 1s steps(2) infinite}
@keyframes ovBlink{50%{opacity:.35}}
.ov-ring.idle{opacity:.5}
.ov-stamp{position:absolute;right:720px;top:-80px;font:800 italic 78px/1 var(--cond);text-transform:uppercase;color:#fff;padding:8px 30px 12px 26px;border:6px solid var(--magenta);border-radius:12px;background:rgba(60,12,80,.88);box-shadow:0 0 40px rgba(226,60,255,.75),inset 0 0 26px rgba(226,60,255,.45);transform:rotate(-7deg) scale(0);opacity:0}
.ov-lowerwrap.sold .ov-stamp{animation:ovStamp .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes ovStamp{0%{transform:rotate(-7deg) scale(2.4);opacity:0}100%{transform:rotate(-7deg) scale(1);opacity:1}}
.ov-lowerwrap.flash .ov-lower{animation:ovFlash .8s}
@keyframes ovFlash{0%{box-shadow:inset 0 0 0 5px #E23CFF}100%{box-shadow:inset 0 0 0 0 transparent}}
.ov-call{position:absolute;right:84px;bottom:318px;font:800 italic 46px/1 var(--cond);text-transform:uppercase;padding:14px 30px 16px 28px;background:var(--grad);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));opacity:0;transform:translateY(20px)}
.ov-call.on{animation:ovCall .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ovCall{to{opacity:1;transform:none}}

.ov-reveal{position:absolute;inset:0;background:radial-gradient(circle at 85% 0%,rgba(58,23,132,.95),rgba(11,10,31,.97) 58%);opacity:0;transition:opacity .6s}
.ov-reveal.on{opacity:1}
.rv-top{position:absolute;left:0;right:0;top:0;height:8px;background:var(--grad)}
.rv-head{position:absolute;left:80px;right:80px;top:54px;display:flex;justify-content:space-between;align-items:flex-end}
.rv-eyebrow{font:600 22px/1 var(--sans);letter-spacing:5px;color:var(--cyan);text-transform:uppercase;margin-bottom:12px}
.rv-title{font:800 italic 108px/1.12 var(--cond);padding-top:10px;text-transform:uppercase;background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:14px}
.rv-count{font:700 italic 42px/1 var(--cond);color:var(--body);text-transform:uppercase;padding-bottom:10px}
.rv-grid{position:absolute;left:80px;right:80px;top:236px;bottom:52px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:22px}
.rv-card{position:relative;background:linear-gradient(180deg,#1C1846,#110E2C);border:1px solid var(--line2);border-radius:14px;padding:18px 24px 16px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.rv-card.hidden{opacity:.55}
.rv-card.hidden .rv-slot .n,.rv-card.hidden .rv-slot .p{color:var(--muted);letter-spacing:4px}
.rv-card.new{border:2px solid var(--magenta);box-shadow:0 0 44px rgba(226,60,255,.6);animation:rvIn .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes rvIn{0%{transform:perspective(900px) rotateY(80deg) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.rv-team{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.rv-team .rv-logo{height:44px;width:auto;max-width:64px;object-fit:contain;flex:none;align-self:center;margin-right:-2px}
.rv-team b{flex:1;min-width:0;font:800 italic 40px/1.05 var(--cond);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.rv-team span{font:700 17px/1 var(--sans);letter-spacing:3px;color:var(--muted);flex:none}
.rv-team .rv-logo+b{font-size:35px}
.rv-slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rv-slot .n{font:600 25px/1.15 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rv-slot .p{font:800 italic 30px/1 var(--cond);color:var(--cyan);white-space:nowrap;padding-right:3px}
.rv-slot.empty .n,.rv-slot.empty .p{color:var(--muted)}
.rv-t{display:inline-block;font:800 italic 17px/1 var(--cond);padding:4px 7px 4px 6px;border-radius:4px;background:var(--grad);color:#fff;margin-right:10px;vertical-align:3px}
.rv-rest{margin-top:auto;font:600 16px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;padding-top:8px}
.rv-rest svg{width:16px;height:16px;fill:var(--muted)}
.rv-sum{align-items:center;justify-content:center;text-align:center;border:2px solid transparent;background:linear-gradient(#150F36,#150F36) padding-box,var(--grad) border-box}
.rv-sum .k{font:600 15px/1 var(--sans);letter-spacing:4px;text-transform:uppercase;color:var(--body)}
.rv-sum b{font:800 italic 96px/1.1 var(--cond);background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent;padding:8px 10px 4px}
.rv-sum b.sm{font-size:44px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rv-sum .v{font:800 italic 34px/1 var(--cond);color:var(--text);margin:4px 0 14px}

/* Einrichtungsfenster im Overlay */
.ov-setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,10,31,.78);opacity:0;pointer-events:none;transition:opacity .3s}
.ov-setup.on{opacity:1;pointer-events:auto}
.su-card{width:1060px;padding:56px 64px 46px;border-radius:24px;border:2px solid transparent;background:linear-gradient(#141137,#0E0C26) padding-box,var(--grad) border-box;box-shadow:0 0 80px rgba(122,60,255,.45)}
.su-brand{font:800 italic 34px/1.15 var(--cond);text-transform:uppercase}
.su-title{font:800 italic 84px/1.1 var(--cond);text-transform:uppercase;margin:10px 0 12px}
.su-text{font:500 28px/1.45 var(--sans);color:var(--body)}
.su-row{display:flex;gap:16px;margin:30px 0 18px}
.su-input{flex:1;min-width:0;width:auto;font:800 italic 64px/1 var(--cond);letter-spacing:6px;text-transform:uppercase;padding:14px 24px;border-radius:14px;border:2px solid var(--line2);background:#0B0A1F;color:var(--text);outline:none}
.su-input:focus{border-color:var(--magenta);box-shadow:none}
.su-btn{flex:none;font:700 30px/1 var(--sans);padding:0 40px;border-radius:14px;border:0;background:var(--grad);color:#fff;cursor:pointer}
.su-status{font:600 24px/1.45 var(--sans);color:var(--cyan);min-height:36px}
.su-foot{font:500 22px/1.45 var(--sans);color:var(--muted);margin-top:14px}
.su-link{font:600 22px/1 var(--sans);background:none;border:0;color:var(--pink);text-decoration:underline;cursor:pointer;padding:0;margin-left:6px}

/* ================= STEUERUNG ================= */
html.mode-control{background:#0B0A1F}
body.mode-control{min-height:100vh;background:radial-gradient(circle at 100% 0%,#22104e 0%,#0B0A1F 45%) fixed;font-size:15px;line-height:1.4}
.c-top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:rgba(11,10,31,.97);border-bottom:1px solid var(--line)}
.c-top::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 16px 8px}
.c-brand{font:800 italic 24px/1 var(--cond);text-transform:uppercase;letter-spacing:.3px}
.grad{background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}
.c-head-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-sync{font:600 12px/1 var(--sans);padding:8px 10px;border-radius:20px;background:#1A1740;color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.c-sync.ok{color:var(--good);border-color:rgba(75,227,168,.45)}
.c-tabs{display:flex;gap:4px;padding:4px 12px 8px;overflow-x:auto}
.c-tabs button{background:transparent;border:1px solid transparent;color:var(--body);padding:8px 12px;white-space:nowrap}
.c-tabs button.on{background:#1A1740;border-color:var(--line2);color:var(--text)}
.c-main{padding:14px max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:1280px;margin:0 auto}

}

        if (z) {
          if (normCode(z.raum).length >= 6) { online.code = normCode(z.raum); try { localStorage.setItem(ROOM_CTL_KEY, online.code); } catch (er) {} }
          if (z.teams && typeof z.teams === 'object') { teamCodes = Object.assign({}, z.teams); ensureCodes(); saveCodes(); }
          if (z.web && !webBase) { webBase = normBase(z.web); try { localStorage.setItem(WEBURL_KEY, webBase); } catch (er) {} }
          startOnline();
        }
        persist(); renderTeamchefs(); renderOnline();
        toast(z ? 'Sicherung geladen – inklusive Raum-Code und Team-Codes.' : 'Sicherung geladen.', 'good');
      } catch (er) { toast('Diese Datei ist keine gültige Sicherung.', 'bad'); }
      e.target.value = '';
    };
    rd.readAsText(f);
  });
  const bindSet = (id, key, kind) => $('#' + id).addEventListener('change', e => act(s => {
    const el = e.target; let v = kind === 'bool' ? el.checked : kind === 'num' ? parseFloat(String(el.value).replace(',', '.')) : el.value;
    if (kind === 'num' && (!isFinite(v) || v < 0)) return 'Bitte eine gültige Zahl eingeben.';
    s.settings[key] = v;
  }));
  bindSet('sLeague', 'league'); bindSet('sSub', 'subtitle'); bindSet('sStats', 'showStats', 'bool'); bindSet('sPool', 'showPool', 'bool'); bindSet('sCount', 'showBidCount', 'bool'); bindSet('sCalls', 'showCalls', 'bool');
  bindSet('sOpen', 'openingSec', 'num'); bindSet('sCd', 'countdownSec', 'num'); bindSet('sStep', 'step', 'num'); bindSet('sRes', 'reserve', 'num'); bindSet('sSLimit', 'sLimit', 'bool'); bindSet('sTierS', 'tierS', 'num'); bindSet('sTierA', 'tierA', 'num'); bindSet('sTierB', 'tierB', 'num'); bindSet('sTeamBids', 'teamBids', 'bool');
  bindSet('sExTeam', 'exTeamRule', 'bool'); bindSet('sProfile', 'showProfile', 'bool'); bindSet('sBgMode', 'bgMode');
  $('#sBgDim').addEventListener('change', e => { const v = parseFloat(String(e.target.value).replace(',', '.')); act(s => { if (!isFinite(v) || v < 0 || v > 90) return 'Bitte 0 bis 90 eingeben.'; s.settings.bgDim = v; }); });
  $('#sAssetRe').addEventListener('click', () => { recheckAssets(); renderAssets(); toast('Dateien werden neu geprüft.'); });
  $('#sBudgets').addEventListener('change', e => { const id = e.target.dataset.budget; if (!id) return; const v = parseFloat(String(e.target.value).replace(',', '.')); act(s => { if (!isFinite(v) || v < 0) return 'Bitte eine gültige Zahl eingeben.'; teamById(s, id).budget = v; }); });
  $('#cResetAuction').addEventListener('click', e => { if (!armed(e.currentTarget)) return; act(resetAuction, 'Auktion zurückgesetzt.'); });
  $('#cResetAll').addEventListener('click', e => { if (!armed(e.currentTarget)) return; undo.push(JSON.stringify(S)); saveUndo(); S = defaultState(); ui.driverDirty = false; ui.infoDirty = false; persist(); toast('Alles auf Anfang gesetzt.', 'good'); });
  const ctlUrl = location.href.split('#')[0];
  $('#cUrlCtl').value = ctlUrl;
  $('#cUrlCopy').addEventListener('click', () => copyText(ctlUrl));

  /* Online-Verbindung zum Streamer */
  const online = { on: true, code: '', room: null, links: [], seq: 0, sid: rid() + rid(), lastPub: 0, lastPing: 0, busy: false, again: false, err: '' };
  /* Teamchef-Codes: bleiben auch nach „Alles auf Anfang“ gleich */
  let teamCodes = {}; try { teamCodes = JSON.parse(localStorage.getItem(TEAMCODES_KEY) || '{}') || {}; } catch (e) { teamCodes = {}; }
  const saveCodes = () => { try { localStorage.setItem(TEAMCODES_KEY, JSON.stringify(teamCodes)); } catch (e) {} };
  function ensureCodes() { let c = false; S.teams.forEach(t => { if (normCode(teamCodes[t.id]).length < 6) { teamCodes[t.id] = newRoomCode(); c = true; } }); if (c) saveCodes(); }
  ensureCodes();
  const tch = {}, teamSeen = {}, teamFb = {}, seenIds = new Set();
  function teamOnline(id) { return Date.now() - (teamSeen[id] || 0) < 12000; }
  async function deriveTeams() {
    await Promise.all(S.teams.map(async t => {
      const c = teamCodes[t.id]; if (tch[t.id] && tch[t.id].code === c) return;
      try { const k = await teamCrypto(c); if (teamCodes[t.id] !== c) return; tch[t.id] = { code: c, ch: k }; online.links.forEach(l => l.subscribe(k.bid)); } catch (e) {}
    }));
  }
  function onOnlineMsg(topic, bytes) {
    const r = online.room; if (r && topic === r.ping) return onPing(topic, bytes);
    for (const id in tch) if (tch[id].ch.bid === topic) return onTeamMsg(id, bytes);
  }
  async function onTeamMsg(tid, bytes) {
    const e = tch[tid]; if (!e) return; let m;
    try { m = await unseal(e.ch, bytes); } catch (er) { return; }
    if (!m || m.v !== 1) return;
    teamSeen[tid] = Date.now();
    if (m.kind !== 'bid' || !m.id || seenIds.has(m.id)) return;
    seenIds.add(m.id);
    const amt = +m.amount, name = teamName(S, tid), l = S.lot;
    if (l && l.bids.some(b => b.id === m.id)) return;
    const reject = reason => { teamFb[tid] = { id: m.id, reason, at: Date.now() }; publishView(); };
    if (!S.settings.teamBids) return reject('Online-Gebote sind gerade gesperrt. Bitte per DM an die Leitung.');
    if (!l || l.no !== m.lot) return reject('Dieses Los ist schon vorbei.');
    if (l.phase === 'called') return reject('Die Eröffnung hat noch nicht begonnen.');
    if (l.phase === 'sold' || l.phase === 'nobid') {
      act(s => { const b = { t: Date.now(), team: tid, amount: amt, phase: 'spaet', valid: false, reason: 'Zu spät: Das Los war schon entschieden.', src: 'online', id: m.id }; s.lot.bids.push(b); const h = s.history.filter(x => x.no === s.lot.no).pop(); if (h) h.bids.push(b); });
      return;
    }
    const reason = validateBid(S, tid, amt);
    act(s => { recordBid(s, tid, amt, reason, { src: 'online', id: m.id }); });
    toast(reason ? `${name} (online): ${fmt(amt)} Mio abgelehnt – ${reason}` : `${name} bietet ${fmt(amt)} Mio (online)`, reason ? 'bad' : 'good');
  }
  const teamRules = 'Am Auktionsabend gibst du dort deine Gebote selbst ab. Du siehst das aktuelle Los, den Countdown, das Höchstgebot, ob du führst, dein Restbudget und dein Maxgebot. Gebote sind verbindlich und zählen erst, wenn sie bei der Leitung ankommen – also nicht erst in der letzten Sekunde bieten. Den Code nicht weitergeben: Damit kann man für dein Team bieten.';
  const teamLink = id => `${webBase}ZRL-Teamchef.html#code=${normCode(teamCodes[id])}`;
  const teamMessage = id => webBase ? `Hi! Dein Teamchef-Zugang für die Fahrer-Auktion (${teamName(S, id)}):

${teamLink(id)}

Einfach antippen – am PC oder am Handy – und du bist eingeloggt. Auf dem iPhone kannst du die Seite über Teilen → „Zum Home-Bildschirm“ wie eine App ablegen. Falls nach dem Code gefragt wird: ${showCode(teamCodes[id])}

${teamRules}` : `Hi! Dein Teamchef-Zugang für die Fahrer-Auktion (${teamName(S, id)}):

1. Die Datei ZRL-Teamchef.html speichern und mit Doppelklick im Browser öffnen (Chrome, Edge oder Firefox).
2. Deinen Code ${showCode(teamCodes[id])} eingeben → „Einloggen“.

Am Auktionsabend gibst du dort deine Gebote selbst ab. Du siehst das aktuelle Los, den Countdown, das Höchstgebot, ob du führst, dein Restbudget und dein Maxgebot. Gebote sind verbindlich und zählen erst, wenn sie bei der Leitung ankommen – also nicht erst in der letzten Sekunde bieten. Den Code nicht weitergeben: Damit kann man für dein Team bieten.`;
  function renderTeamchefs() {
    const box = $('#tcTable'); if (!box) return;
    $('#tcWarn').innerHTML = !online.on ? '<div class="c-warn">Online-Senden ist aus (Tab „Verbindung“). Ohne Online-Verbindung können Teamchefs nicht bieten.</div>' : online.err ? `<div class="c-warn">${esc(online.err)}</div>` : '';
    box.innerHTML = `<table><thead><tr><th>Team</th><th>Code</th><th>Status</th><th></th></tr></thead><tbody>${S.teams.map(t => {
      const seen = teamSeen[t.id]; const st = teamOnline(t.id) ? '<span class="c-on">● online</span>' : seen ? `<small>zuletzt ${clock(seen)}</small>` : '<small>noch nie</small>';
      return `<tr><td><b>${esc(t.name)}</b></td><td><span class="c-code">${showCode(teamCodes[t.id])}</span></td><td>${st}</td><td><div class="c-row" style="justify-content:flex-end"><button class="c-small" data-tc="msg" data-team="${t.id}">Nachricht</button><button class="c-small danger confirm2" data-tc="new" data-team="${t.id}">Neuer Code</button></div></td></tr>`;
    }).join('')}</tbody></table>`;
  }
  function renderTeamsOn() {
    const n = S.teams.filter(t => teamOnline(t.id)).length, el = $('#cTeamsOn');
    el.textContent = `Teamchefs online ${n}/${S.teams.length}`; el.classList.toggle('ok', n > 0); el.hidden = !online.on;
  }
  let lastOnlKey = '';
  try { online.on = localStorage.getItem(ONLINE_KEY) !== '0'; online.code = normCode(localStorage.getItem(ROOM_CTL_KEY) || ''); } catch (e) {}
  if (online.code.length < 6) { online.code = newRoomCode(); try { localStorage.setItem(ROOM_CTL_KEY, online.code); } catch (e) {} }
  function stopOnline() { online.links.forEach(l => l.close()); online.links = []; online.room = null; }
  async function startOnline() {
    stopOnline(); online.err = ''; renderOnline(); if (!online.on) return;
    const code = online.code; let r;
    try { r = await roomCrypto(code); } catch (e) { online.err = 'Die Verschlüsselung wird in diesem Browser nicht unterstützt. Bitte Chrome, Edge oder das OBS-Dock nutzen.'; renderOnline(); return; }
    if (code !== online.code || !online.on) return;
    online.room = r;
    online.links = brokerList().map(url => new MiniMQTT(url, { onStatus: renderOnline, onUp: () => publishView(), onMessage: onOnlineMsg }));
    online.links.forEach(l => l.subscribe(r.ping)); Object.keys(tch).forEach(k => delete tch[k]); await deriveTeams(); renderOnline(); publishView();
  }
  async function publishView() {
    if (!online.on || !online.room) return;
    if (online.busy) { online.again = true; return; }
    online.busy = true;
    try {
      do { online.again = false; const r = online.room; if (!r) break;
        const seq = ++online.seq;
        const b = await seal(r, { v: 1, sid: online.sid, seq, sentAt: Date.now(), view: publicView(S) });
        if (r === online.room) online.links.forEach(l => l.publish(r.topic, b, true));
        for (const t of S.teams) {
          const e = tch[t.id]; if (!e) continue;
          const f = teamFb[t.id] && Date.now() - teamFb[t.id].at < 60000 ? teamFb[t.id] : null;
          const tb = await seal(e.ch, { v: 1, sid: online.sid, seq, sentAt: Date.now(), view: teamView(S, t.id, f) });
          if (tch[t.id] === e) online.links.forEach(l => l.publish(e.ch.view, tb, true));
        }
        online.lastPub = Date.now();
      } while (online.again);
    } catch (e) { console.error(e); } finally { online.busy = false; }
  }
  async function onPing(topic, bytes) { const r = online.room; if (!r || topic !== r.ping) return; try { const m = await unseal(r, bytes); if (m && m.kind === 'overlay') online.lastPing = Date.now(); } catch (e) {} }
  let webBase = ''; try { webBase = normBase(localStorage.getItem(WEBURL_KEY) || ''); } catch (e) {}
  if (!webBase && /^https?:$/.test(location.protocol)) webBase = normBase(location.href);
  const streamerMessage = () => webBase ? `Hi! Für die Fahrer-Auktion brauchst du nur das Overlay – steuern werde ich es von meinem PC aus.

1. In OBS: Quelle hinzufügen → Browser. „Lokale Datei“ NICHT anhaken, sondern als URL eintragen:
${webBase}ZRL-Overlay.html#raum=${normCode(online.code)}
2. Breite 1920, Höhe 1080. Die Quelle in der Szene ganz nach oben legen.

Steht dort „Warte auf die Steuerung der Ligaleitung“, ist alles richtig – den Rest mache ich. Den Link bitte nicht weitergeben.` : `Hi! Für die Fahrer-Auktion brauchst du nur das Overlay – steuern werde ich es von meinem PC aus.

1. Die Datei ZRL-Overlay.html speichern.
2. In OBS: Quelle hinzufügen → Browser → „Lokale Datei“ anhaken → die Datei wählen. Breite 1920, Höhe 1080. Die Quelle in der Szene ganz nach oben legen.
3. Rechtsklick auf die Quelle → „Interagieren“ → Raum-Code ${showCode(online.code)} eingeben → „Verbinden“.

Steht dort „Warte auf die Steuerung der Ligaleitung“, ist alles richtig – den Rest mache ich. Den Code bitte nicht weitergeben.`;
  function renderOnline() {
    $('#oCode').textContent = showCode(online.code); $('#oOn').checked = online.on;
    const host = u => { try { return new URL(u).hostname; } catch (e) { return u; } };
    const lab = { up: 'verbunden', connecting: 'verbinde …', down: 'getrennt – neuer Versuch läuft', closed: 'aus', idle: '…' };
    const t = Date.now(), fresh = t - online.lastPing < 8000;
    $('#oStatus').innerHTML = !online.on ? '<p class="c-hint">Online-Senden ist aus. Ein Overlay beim Streamer bekommt keine Daten.</p>'
      : online.err ? `<div class="c-warn">${esc(online.err)}</div>`
      : online.links.map((l, i) => `<div class="c-orow"><span>Server ${i + 1}<small>${esc(host(l.url))}</small></span><b class="${l.state === 'up' ? 'ok' : ''}">${lab[l.state] || l.state}</b></div>`).join('')
        + `<div class="c-orow"><span>Overlay beim Streamer</span><b class="${fresh ? 'ok' : ''}">${fresh ? 'verbunden' : online.lastPing ? 'zuletzt um ' + clock(online.lastPing) : 'noch nicht verbunden'}</b></div>`;
    const ta = $('#oMsg'); if (document.activeElement !== ta) ta.value = streamerMessage();
    const w = $('#oWeb'); if (document.activeElement !== w) w.value = webBase;
    $('#oWebLinks').innerHTML = webBase ? `<div class="c-orow"><span>Startseite</span><b><code>${esc(webBase)}</code></b></div><div class="c-orow"><span>Overlay mit Raum-Code</span><b><code>${esc(webBase)}ZRL-Overlay.html#raum=${normCode(online.code)}</code></b></div><p class="c-hint">Die Teamchef-Links mit Code findest du im Tab „Teamchefs“ unter „Nachricht“.</p>` : '';
  }
  function renderSync() {
    let p = 0; try { p = +localStorage.getItem(PING_KEY) || 0; } catch (e) {}
    const t = Date.now(), loc = t - p < 3500, rem = !!online.room && t - online.lastPing < 8000, el = $('#cSync');
    el.classList.toggle('ok', loc || rem);
    el.textContent = loc && rem ? '● Overlay verbunden (hier + Streamer)' : rem ? '● Streamer-Overlay verbunden' : loc ? '● Overlay verbunden (dieser PC)' : '● Overlay nicht verbunden';
  }
  $('#oWeb').addEventListener('change', e => { webBase = normBase(e.target.value); try { localStorage.setItem(WEBURL_KEY, webBase); } catch (er) {} renderOnline(); toast(webBase ? 'Online-Adresse gespeichert. Die Nachrichten enthalten jetzt Links.' : 'Online-Adresse entfernt.', 'good'); });
  onWake(() => online.links.forEach(l => l.wake()));
  $('#oOn').addEventListener('change', e => { online.on = e.target.checked; try { localStorage.setItem(ONLINE_KEY, online.on ? '1' : '0'); } catch (er) {} startOnline(); });
  $('#oCopy').addEventListener('click', () => copyText(showCode(online.code)));
  $('#oMsgCopy').addEventListener('click', () => copyText(streamerMessage()));
  $('#tcTable').addEventListener('click', async e => {
    const b = e.target.closest('button[data-tc]'); if (!b) return; const id = b.dataset.team;
    if (b.dataset.tc === 'msg') return copyText(teamMessage(id));
    if (!armed(b)) return;
    const old = tch[id]; teamCodes[id] = newRoomCode(); saveCodes(); delete tch[id]; delete teamSeen[id];
    if (old) online.links.forEach(l => l.publish(old.ch.view, new Uint8Array(0), true));
    await deriveTeams(); publishView(); renderTeamchefs(); renderTeamBtns();
    toast(`Neuer Code für ${teamName(S, id)}: ${showCode(teamCodes[id])}. Der alte gilt nicht mehr.`, 'good');
  });
  $('#tcCopyAll').addEventListener('click', () => copyText(S.teams.map(t => `${t.name}: ${showCode(teamCodes[t.id])}`).join('\n')));
  $('#oNew').addEventListener('click', e => { if (!armed(e.currentTarget)) return; online.code = newRoomCode(); online.lastPing = 0; try { localStorage.setItem(ROOM_CTL_KEY, online.code); } catch (er) {} startOnline(); toast('Neuer Code. Der Streamer muss ihn im Overlay eingeben.', 'good'); });

  /* Takt: Zeitabläufe, Verbindung, Abgleich – läuft auch, wenn das Fenster im Hintergrund ist */
  const onTick = makeTicker(100); let tickN = 0;
  onTick(() => {
    const l = S.lot, t = Date.now();
    if (l && l.phase === 'opening' && t >= l.openingEnd) act(endOpening);
    else if (l && l.phase === 'bidding' && t >= l.countdownEnd) act(hammer);
    updateTimers();
    if (++tickN % 10) return;
    online.links.forEach(k => k.tick());
    if (online.room) { const lt = S.lot, active = lt && (lt.phase === 'opening' || lt.phase === 'bidding' || (lt.drawUntil && lt.drawUntil > t)); if (active || t - online.lastPub > 10000) publishView(); }
    renderSync(); renderTeamsOn(); if (ui.tab === 'hilfe') renderOnline(); if (ui.tab === 'teamchefs') renderTeamchefs();
    const ok = S.teams.map(x => teamOnline(x.id) ? 1 : 0).join(''); if (ok !== lastOnlKey) { lastOnlKey = ok; renderTeamBtns(); }
    let r = null; try { r = localStorage.getItem(STORE_KEY); } catch (e) {}
    if (r && r !== lastRaw) { try { const s = JSON.parse(r); if (s && s.v === 1) { S = migrate(s); lastRaw = r; ov.setState(S); renderAll(); publishView(); } } catch (e) {} }
  });

  lastRaw = saveState(S); ov.setState(S); renderAll(); renderOnline(); renderSync(); renderTeamchefs(); renderTeamsOn(); startOnline();
}

/* ---------- Start ---------- */
(function () {
  const h = (location.hash || '').replace('#', '').toLowerCase();
  const mode = h === 'overlay' ? 'overlay' : h === 'steuerung' ? 'control' : h === 'teamchef' ? 'team' : MODE;
  if (mode === 'overlay') startOverlay(); else if (mode === 'team') startTeam(); else if (mode === 'start') startStart(); else startControl();
})();
</script>
